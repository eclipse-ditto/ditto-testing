# use DOCKER_HOST env variable if set
default.hostname = ${?DOCKER_HOST}
# system property docker.daemon.hostname has precendence before DOCKER_HOST!
default.hostname = ${?docker.daemon.hostname}

setup.http.proxy {
  enabled = false
  enabled = ${?PROXY_ENABLED}
}

gateway {
  hostname = ${default.hostname}
  port = 8080
  url = "http://"${gateway.hostname}":"${gateway.port}
  ws-url = "ws://"${gateway.hostname}":"${gateway.port}

  devops {
    url = ${gateway.url}
    command-timeout = 30s

    auth.enabled = false
  }
}

oauth-mock {
  tokenEndpoint = "http://localhost:9900/ditto/token"
}

# PostgreSQL published on the host (docker-compose.override.yml, or the "Postgres for test" run config). Only
# read when the tests run with -Dpersistence.backend=postgres (CleanupIT's PersistenceInspector).
postgres {
  jdbc-uri = "jdbc:postgresql://localhost:5432/ditto"
  jdbc-uri = ${?POSTGRES_JDBC_URI}
  user = "ditto"
  password = "ditto"
}
