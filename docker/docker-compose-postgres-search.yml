# things-search-on-PostgreSQL override. Layer AFTER docker-compose-postgres.yml (which itself layers
# after docker-compose.yml + docker-compose.override.yml), and ONLY when SEARCH_BACKEND=postgres:
#
#   docker-compose -f docker-compose.yml -f docker-compose.override.yml \
#                  -f docker-compose-postgres.yml -f docker-compose-postgres-search.yml up -d
#
# `DITTO_DB=postgres ./start.sh` appends this file automatically when SEARCH_BACKEND=postgres (its default);
# with SEARCH_BACKEND=mongodb it is omitted and things-search keeps indexing in MongoDB.
#
# It touches ONLY the things-search service. The two extension JARs it needs (the shaded base
# ditto-postgres-client-extension + the thin ditto-postgres-search-extension) are BAKED INTO the
# things-search image by ditto/build-images.sh (BAKE_POSTGRES_EXTENSIONS=true) under /opt/ditto/extensions/;
# this file only adds the search-postgres.conf overlay (HOSTING_ENVIRONMENT=filebased) and the POSTGRES_*
# environment. things-search needs the DDL role to `CREATE EXTENSION IF NOT EXISTS pg_trgm` at boot —
# auto-satisfied by the local `ditto` superuser in postgres:16.

version: "2.4"

services:

  things-search:
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./postgres/search-postgres.conf:/opt/ditto/search-postgres.conf:ro
    environment:
      - HOSTING_ENVIRONMENT=filebased
      - HOSTING_ENVIRONMENT_FILE_LOCATION=/opt/ditto/search-postgres.conf
      - POSTGRES_URI=r2dbc:postgresql://postgres:5432/ditto
      - POSTGRES_USER=ditto
      - POSTGRES_PASSWORD=ditto
      - POSTGRES_DDL_USER=ditto
      - POSTGRES_DDL_PASSWORD=ditto
      - POSTGRES_SSL_MODE=disable
