# Containerized Postgres overlay for the Ditto Connectivity service (system-test docker environment).
#
# Injected as the highest-priority config layer by docker-compose-postgres.yml:
#
#     HOSTING_ENVIRONMENT=filebased
#     HOSTING_ENVIRONMENT_FILE_LOCATION=/opt/ditto/connectivity-postgres.conf
#
# There is no connectivity overlay in ditto/deployment/postgres-local/ — the classpath precedent is
# connectivity-pg-dev.conf, which includes the localhost connectivity-dev profile. This overlay instead
# includes the RAW service config: cluster seed-nodes/hostnames come from the -D flags in
# JAVA_TOOL_OPTIONS (system properties override file config) and everything else stays env-var wired
# exactly as in the plain docker run.
#
# CLASSPATH NOTE: includes MUST use `include required(classpath("..."))`. The FILE_BASED config is parsed
# with ConfigFactory.parseFileAnySyntax(file); a bare `include "..."` is resolved file-relative first and only
# then on the classpath (a stray sibling file could shadow the resource), and a plain `include classpath(...)`
# of a resource that is MISSING is silently ignored: with a service image built without the Postgres extension
# JARs (BAKE_POSTGRES_EXTENSIONS unset) this service would then start with the auto-start list below naming a
# plugin block that does not exist. `required(...)` makes such an image fail at config load instead, with
# "ConfigException$IO: … resource not found on classpath: ditto-postgres-persistence.conf".
# The Postgres include is at the TOP LEVEL — ditto-postgres-persistence.conf ships top-level Pekko plugin
# blocks; nesting it inside `ditto { }` would misplace them and Pekko would never find them.
#
# NO snapshot-adapter override: AbstractPersistenceActor composes the snapshot-serializer with the
# Postgres provider's JSONB snapshot codec automatically. Do NOT add one here.
#
# Connection params (POSTGRES_URI / POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DDL_* /
# POSTGRES_SSL_MODE) are supplied via ENV — see docker-compose-postgres.yml.
# ---------------------------------------------------------------------------------------------------------------------

# 1. The regular Connectivity service config (env-var wired; NOT the localhost connectivity-dev profile).
include required(classpath("connectivity"))

# 2. Postgres persistence backend + R2DBC client/pool/SSL defaults (one file). TOP-LEVEL include.
include required(classpath("ditto-postgres-persistence"))

# Redundant with ditto-postgres-persistence.conf (which sets ddata itself); kept as belt-and-braces,
# mirroring connectivity-pg-dev.conf: the default "eventsourced" remember-entities store would persist
# Pekko-internal events through a journal whose adapter bindings cannot encode them.
pekko.cluster.sharding.remember-entities-store = "ddata"

# Narrows ditto-postgres-persistence.conf's 4-entity default auto-start lists (it sets
# pekko.persistence.*.auto-start-* itself) to just the Connections plugins — required: this service only defines
# its own entity's persistence dispatchers; the profile's 4-entity default would reference missing dispatchers here.
pekko.persistence.journal.auto-start-journals = [ "ditto-postgres-connections-journal" ]
pekko.persistence.snapshot-store.auto-start-snapshot-stores = [ "ditto-postgres-connections-snapshots" ]

# Placeholder Mongo-collection names so ConnectionPersistenceOperationsActor can construct.
ditto-postgres-connections-journal.overrides {
  journal-collection = "connections_journal"
  metadata-collection = "connections_metadata"
}
ditto-postgres-connections-snapshots.overrides {
  snaps-collection = "connections_snaps"
}
