# Containerized Postgres overlay for the Ditto Things-Search service (system-test docker environment).
#
# Injected as the highest-priority config layer by docker-compose-postgres-search.yml (only when
# SEARCH_BACKEND=postgres):
#
#     HOSTING_ENVIRONMENT=filebased
#     HOSTING_ENVIRONMENT_FILE_LOCATION=/opt/ditto/search-postgres.conf
#
# Sibling of the three persistence overlays (policies/things/connectivity-postgres.conf), same rules:
# includes the RAW service config (env-var wired; NOT the localhost search-dev profile) — cluster
# seed-nodes/hostnames come from the -D flags in JAVA_TOOL_OPTIONS and everything else stays env-var
# wired exactly as in the plain docker run. This mirrors ditto/deployment/postgres-local/search-postgres.conf
# (whose base is search-dev instead of the raw search config).
#
# CLASSPATH NOTE: includes MUST use `include required(classpath("..."))`. The FILE_BASED config is parsed
# with ConfigFactory.parseFileAnySyntax(file); a bare `include "..."` is resolved file-relative first and only
# then on the classpath (a stray sibling file could shadow the resource), and a plain `include classpath(...)`
# of a resource that is MISSING is silently ignored: with a things-search image built without the Postgres
# extension JARs the second include would vanish, search.conf's default MongoSearchPersistenceProvider would
# stay selected, and things-search would silently run on MongoDB while everything else is on PostgreSQL.
# `required(...)` makes such an image fail at config load instead, with "ConfigException$IO: … resource not
# found on classpath: ditto-postgres-search.conf". Both includes are TOP LEVEL.
#
# NO auto-start-journal narrowing (unlike the persistence overlays): the search service runs no
# event-sourcing journal (it sets no pekko.persistence.*.auto-start-*). The ditto-postgres-search include
# swaps ditto.extensions.search-persistence-provider to the PostgreSQL provider and pulls in the shared
# ditto.postgresql.* client/plan/reaper defaults — nothing to narrow.
#
# Connection params (POSTGRES_URI / POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DDL_* /
# POSTGRES_SSL_MODE) are supplied via ENV — see docker-compose-postgres-search.yml. The DDL role must be
# able to `CREATE EXTENSION IF NOT EXISTS pg_trgm` at boot (auto-satisfied by the local `ditto` superuser).
# ---------------------------------------------------------------------------------------------------------------------

# 1. The regular Things-Search service config (env-var wired; NOT the localhost search-dev profile).
include required(classpath("search"))

# 2. Opt-in PostgreSQL search backend + shared R2DBC client/pool/SSL defaults. TOP-LEVEL include.
include required(classpath("ditto-postgres-search"))
