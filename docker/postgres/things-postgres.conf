# Containerized Postgres overlay for the Ditto Things service (system-test docker environment).
#
# Injected as the highest-priority config layer by docker-compose-postgres.yml:
#
#     HOSTING_ENVIRONMENT=filebased
#     HOSTING_ENVIRONMENT_FILE_LOCATION=/opt/ditto/things-postgres.conf
#
# Unlike ditto/deployment/postgres-local/things-postgres.conf (which delegates to the classpath
# things-pg-dev.conf profile with its localhost dev-cluster settings), this overlay includes the RAW
# service config: cluster seed-nodes/hostnames come from the -D flags in JAVA_TOOL_OPTIONS (system
# properties override file config) and everything else stays env-var wired exactly as in the plain
# docker run.
#
# CLASSPATH NOTE: includes MUST use `include required(classpath("..."))`. The FILE_BASED config is parsed
# with ConfigFactory.parseFileAnySyntax(file); a bare `include "..."` is resolved file-relative first and only
# then on the classpath (a stray sibling file could shadow the resource), and a plain `include classpath(...)`
# of a resource that is MISSING is silently ignored: on the image's `mongodb` backend folder (a container
# without DITTO_PERSISTENCE_BACKEND=postgresql) this service would then start on MongoDB. `required(...)` makes
# it fail at config load instead, with
# "ConfigException$IO: … resource not found on classpath: ditto-postgres-persistence.conf".
# The Postgres include is at the TOP LEVEL — ditto-postgres-persistence.conf ships top-level Pekko plugin
# blocks; nesting it inside `ditto { }` would misplace them and Pekko would never find them.
#
# NO snapshot-adapter override: AbstractPersistenceActor composes the snapshot-serializer with the
# Postgres provider's JSONB snapshot codec automatically. Do NOT add one here.
#
# Connection params (POSTGRES_URI / POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DDL_* /
# POSTGRES_SSL_MODE) are supplied via ENV — see docker-compose-postgres.yml.
# ---------------------------------------------------------------------------------------------------------------------

# 1. The regular Things service config (env-var wired; NOT the localhost things-dev profile).
include required(classpath("things"))

# 2. Pins the PostgreSQL persistence profile (backend + R2DBC client/pool/SSL defaults) by its unique name.
#    TOP-LEVEL include. A container started on the wrong backend folder (no DITTO_PERSISTENCE_BACKEND=postgresql)
#    fails here at config load instead of running the tests against MongoDB. On the `postgresql` folder the
#    service conf's own `include classpath("ditto-persistence-backend")` already loads this profile, so
#    re-including it is a no-op there.
include required(classpath("ditto-postgres-persistence"))
